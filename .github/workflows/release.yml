name: Release

# Erstellt automatisch ein GitHub-Release, sobald sich die Version in der
# manifest.json ändert (Tag vX.Y.Z, Text aus CHANGELOG.md), und hängt das
# Handbuch als PDF an (Deutsch, Englisch und Französisch). Ändert sich nur das Handbuch,
# werden die PDFs am bestehenden Release ersetzt.
on:
  push:
    branches: [main]
    paths:
      - custom_components/raumklima/manifest.json
      - .github/workflows/release.yml
      - handbook/**
      - docs/de/faq.md
      - docs/en/faq.md
      - docs/fr/faq.md
      - docs/images/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Version lesen
        id: v
        run: |
          VERSION=$(jq -r .version custom_components/raumklima/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Beta = Version mit bN am Ende (0.60.0b1), Release Candidate = rcN (0.62.46rc1).
          # Beide werden als Vorabversion veröffentlicht: HACS zeigt sie nur, wenn man dort
          # „Beta-Versionen anzeigen“ aktiviert; „latest“ bleibt die letzte stabile.
          # Unterschied: ein RC ist der Kandidat für die stabile Version – er bekommt die
          # Handbuch-PDFs, damit auch die vor der Freigabe geprüft werden können.
          if printf '%s' "$VERSION" | grep -Eq '[0-9]+b[0-9]+$'; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
            echo "label=Beta" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$VERSION" | grep -Eq '[0-9]+rc[0-9]+$'; then
            echo "beta=false" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
            echo "label=Release Candidate" >> "$GITHUB_OUTPUT"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      # Entscheidend ist das *Release*, nicht der Tag: wird der Tag von Hand gepusht, bevor dieser
      # Lauf startet, gibt es den Tag schon, aber noch kein Release – dann muss es erstellt werden.
      - name: Release schon vorhanden?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Handbuch bauen (PDF)
        # Betas kommen ohne PDFs: spart den Playwright-Lauf, und die Links in der Karte
        # zeigen ohnehin auf das letzte stabile Release (releases/latest).
        if: steps.v.outputs.beta != 'true'
        working-directory: handbook
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Text aus dem Changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" 'index($0, "## " v " ") == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Siehe CHANGELOG.md" > notes.md
          cat notes.md

      - name: Release erstellen
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ohne --target: existiert der Tag bereits, hängt gh das Release daran; sonst legt es ihn an.
          # Beta: als Vorabversion ohne PDFs (schneller Lauf, „latest“ bleibt stabil).
          # Release Candidate: Vorabversion mit PDFs.
          if [ "${{ steps.v.outputs.beta }}" = "true" ]; then
            gh release create "v${{ steps.v.outputs.version }}" \
              --title "Raumklima v${{ steps.v.outputs.version }} (Beta)" \
              --notes-file notes.md \
              --prerelease --latest=false --target "${{ github.sha }}"
          elif [ "${{ steps.v.outputs.pre }}" = "true" ]; then
            gh release create "v${{ steps.v.outputs.version }}" \
              --title "Raumklima v${{ steps.v.outputs.version }} (${{ steps.v.outputs.label }})" \
              --notes-file notes.md \
              --prerelease --latest=false --target "${{ github.sha }}" \
              handbook/dist/Raumklima-Handbuch.pdf handbook/dist/Raumklima-Manual.pdf handbook/dist/Raumklima-Manuel.pdf
          else
            gh release create "v${{ steps.v.outputs.version }}" \
              --title "Raumklima v${{ steps.v.outputs.version }}" \
              --notes-file notes.md \
              handbook/dist/Raumklima-Handbuch.pdf handbook/dist/Raumklima-Manual.pdf handbook/dist/Raumklima-Manuel.pdf
          fi

      - name: Handbuch am bestehenden Release ersetzen
        # Betas haben keine PDFs – dort gibt es nichts zu ersetzen
        if: steps.check.outputs.exists == 'true' && steps.v.outputs.beta != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.v.outputs.version }}" --clobber \
            handbook/dist/Raumklima-Handbuch.pdf handbook/dist/Raumklima-Manual.pdf handbook/dist/Raumklima-Manuel.pdf
