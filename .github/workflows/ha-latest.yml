name: HA neueste Version

# Läuft gegen die jeweils neueste Home-Assistant-Version (nicht die gepinnte Testumgebung).
# Zweck: Abkündigungen und Brüche fallen wöchentlich auf, nicht erst am Release-Tag.
# Bewusst kein Auslöser bei Pull Requests – ein roter Lauf hier blockiert keine Arbeit.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-neueste-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Testumgebung ohne feste HA-Version
        run: |
          python -m pip install --upgrade pip
          grep -v "pytest-homeassistant-custom-component" requirements_test.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
          pip install --upgrade pytest-homeassistant-custom-component
          pip list | grep -E "homeassistant|pytest-homeassistant" || true
      - name: Tests
        run: pytest tests -q -p no:logging
